name: poulpoints
description: Gestion de tâches libre et multiplateforme de Poulapp.
publish_to: none
version: 0.8.5+26

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  file_selector: 1.1.0
  url_launcher: ^6.3.2
  sembast: ^3.8.5
  sembast_web: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  http: ^1.4.0
  shared_preferences: ^2.5.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/poulpoints_logo.png
