Categories:
  - Task
License: MIT
AuthorName: Poulapp
SourceCode: https://github.com/LouisLePoulpe/Poulpoints
IssueTracker: https://github.com/LouisLePoulpe/Poulpoints/issues

AutoName: Poulpoints
Summary: Tasks, recurring reminders and home screen widgets
Description: |
  Manage tasks, projects, subtasks and recurring reminders offline.
  Optional synchronization with a configurable Supabase server.
  Android home screen widget with scrolling and task completion.

RepoType: git
Repo: https://github.com/LouisLePoulpe/Poulpoints.git

Builds:
  - versionName: 0.7.1
    versionCode: 20
    commit: v0.7.1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@abaf9c523780a608bd46686fd5e53740a07077f8
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - unset POULPOINTS_TEST_SIGNING POULPOINTS_SIGNING_PROPERTIES
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm64

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 0.7.1
CurrentVersionCode: 20
